name: 0 - Testar coletor Digisystem

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digisystem-test-collector
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Chromium
        run: playwright install --with-deps chromium

      - name: Executar somente o coletor
        run: python -u vagas_pipeline.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Guardar evidencias da coleta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-coletor-digisystem
          path: |
            vagas_digisystem.csv
            vagas_digisystem.xlsx
            prompt_pronto.txt
            screenshot_erro.png
          if-no-files-found: warn
