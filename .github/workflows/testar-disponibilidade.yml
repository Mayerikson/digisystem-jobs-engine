name: 1 - Testar disponibilidade individual das vagas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Chromium
        run: playwright install --with-deps chromium

      - name: Verificar amostra de vagas
        run: python -u testar_disponibilidade.py

      - name: Guardar resultados da verificacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao-disponibilidade-digisystem
          path: |
            verificacao_amostra.json
            verificacao_amostra.csv
          if-no-files-found: warn
          retention-days: 14
